name: "Run tox"
description: "Composite action to install tox & tox-gh-actions and run tests via tox."

inputs:
  python-path:
    description: "Path to Python executable"
    required: true

  python-version:
    description: "Installed Python version"
    required: true

  tox-version:
    description: "Tox version to use"
    required: false
    default: "4.60.0"

  tox-gh-actions-version:
    description: "Tox GitHub Actions plugin version to use"
    required: false
    default: "3.5.0"

  use-coveralls:
    description: "Send coverage to Coveralls"
    required: false
    default: "false"

  coveralls-token:
    description: "GitHub token to use, when sending coverage to Coveralls"
    required: false

runs:
  using: "composite"
  steps:
    - name: "Install tox & tox-gh-actions"
      env:
        PYTHON: "${{ inputs.python-path }}"
        TOX_GH_ACTIONS_VERSION: "${{ inputs.tox-gh-actions-version }}"
        TOX_VERSION: "${{ inputs.tox-version }}"
      run: |
        set -euo pipefail

        pipx install --python="${PYTHON}" tox==${TOX_VERSION}
        pipx inject tox tox-gh-actions==${TOX_GH_ACTIONS_VERSION}
      shell: "bash"

    - name: "Cache tox"
      uses: "actions/cache@v6.1.0"
      with:
        path: ".tox/"
        key: "tox-${{ inputs.python-version }}"

    - name: "Run tox"
      run: "tox"
      shell: "bash"

    - name: "Install project"
      if: "${{ inputs.use-coveralls == 'true' }}"
      run: "poetry install --only test"
      shell: "bash"

    - name: "Convert .coverage to XML format"
      if: "${{ inputs.use-coveralls == 'true' }}"
      run: "poetry run coverage xml"
      shell: "bash"

    - name: "Send coverage to Coveralls"
      if: "${{ inputs.use-coveralls == 'true' }}"
      uses: "coverallsapp/github-action@v2.3.8"
      with:
        github-token: "${{ inputs.coveralls-token }}"
        format: "cobertura"
