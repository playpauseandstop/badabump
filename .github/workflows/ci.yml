defaults:
  run:
    shell: "bash"
permissions:
  contents: "read"

name: "[AUTO] CI"

on:
  push:
    branches: ["main"]
    tags: ["v*"]
  pull_request:
    branches: ["main"]

concurrency:
  group: "${{ github.workflow }}-${{ github.head_ref || github.run_id }}"
  cancel-in-progress: true

env:
  PYTHONUNBUFFERED: "1"

jobs:
  dev:
    name: "Verify package is installed well"

    strategy:
      matrix:
        os: ["ubuntu-24.04", "macos-26", "windows-2025"]

        # https://raw.githubusercontent.com/actions/python-versions/main/versions-manifest.json
        # does not have versions after 3.10.11 available for macOS or Windows :cry:
        include:
          - os: "ubuntu-24.04"
            python-version: ""

          - os: "macos-26"
            python-version: "3.10.11"

          - os: "windows-2025"
            python-version: "3.10.11"
            make-install-args: "PYTHON_BIN=.venv/Scripts/python.exe"

    runs-on: "${{ matrix.os }}"
    env:
      UV_NO_DEFAULT_GROUPS: "true"

    steps:
      - uses: "actions/checkout@v7.0.1"
        with:
          persist-credentials: false

      - uses: "./.github/actions/setup_uv"
        with:
          python-version: "${{ matrix.python-version }}"

      - name: "Install package"
        env:
          MAKE_INSTALL_ARGS: "${{ matrix.make-install-args }}"
        run: |
          # shellcheck disable=SC2086
          make install ${MAKE_INSTALL_ARGS}

      - name: "Import package"
        run: "uv run python -c 'import badabump'"

      - name: "Invoke cli via Python"
        run: "uv run -m badabump --help"

      - name: "Invoke cli via shortcut"
        run: "uv run badabump --help"

      - name: "Invoke CI cli via Python"
        run: "uv run -m badabump.ci --help"

      - name: "Invoke CI cli via shortcut"
        run: "uv run badabump-ci --help"

  test:
    name: "Python ${{ matrix.python-version }}"

    strategy:
      matrix:
        python-version: ["3.10", "3.11", "3.12", "3.13", "3.14"]
        include:
          - python-version: "3.10"
            dev: "true"

    runs-on: "ubuntu-24.04"

    steps:
      - uses: "actions/checkout@v7.0.1"
        with:
          persist-credentials: false

      - id: "uv"
        uses: "./.github/actions/setup_uv"
        with:
          python-version: "${{ matrix.python-version }}"

      - if: "${{ matrix.dev == 'true' }}"
        uses: "./.github/actions/run_pre_commit"
        with:
          python-version: "${{ steps.uv.outputs.python-version }}"
          install-cmd: "make install"

      - name: "Setup git for test needs"
        run: |
          set -euo pipefail

          git config --global init.defaultBranch main
          git config --global user.name badabump-bot[bot]
          git config --global user.email 86060+badabump-bot[bot]@users.noreply.github.com

      - uses: "./.github/actions/run_tox"
        with:
          python-version: "${{ steps.uv.outputs.python-version }}"
          use-coveralls: "${{ matrix.dev }}"
          install-cmd: "make install"
          coveralls-token: "${{ secrets.GITHUB_TOKEN }}"

  package:
    needs: ["test"]

    permissions:
      id-token: "write"

    uses: "./.github/workflows/ci_package.yml"

  release:
    permissions:
      contents: "write"

    needs: ["package"]
    if: "${{ startsWith(github.ref, 'refs/tags/') }}"

    name: "Create GitHub Release"

    runs-on: "ubuntu-24.04"
    env:
      UV_NO_DEFAULT_GROUPS: "true"

    steps:
      - uses: "actions/checkout@v7.0.1"
        with:
          persist-credentials: false
          fetch-depth: 0
          fetch-tags: true

      - uses: "./.github/actions/setup_uv"

      - name: "Install badabump"
        run: "make install"

      - id: "badabump"
        name: "Run badabump"
        env:
          BADABUMP_CI: "uv run -m badabump.ci"
        run: '${BADABUMP_CI} prepare_release "${GITHUB_REF}"'

      - name: "Create new release"
        env:
          GH_TOKEN: "${{ secrets.release-token }}"
          IS_PRE_RELEASE: "${{ steps.badabump.outputs.is_pre_release }}"
          RELEASE_BODY: "${{ steps.badabump.outputs.release_body }}"
          RELEASE_NAME: "${{ steps.badabump.outputs.release_name }}"
          TAG_NAME: "${{ steps.badabump.outputs.tag_name }}"
        run: |
          set -euo pipefail

          args=()
          if [ "${IS_PRE_RELEASE}" = "true" ]; then
            args+=(--prerelease)
          fi

          gh release create "${TAG_NAME}" \
            --title "${RELEASE_NAME}" \
            --notes "${RELEASE_BODY}" \
            "${args[@]}"
